name: Build BD Calorie Tracker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Signing Keystore
        run: |
          if [ ! -f app/release-key.jks ]; then
            keytool -genkey -v -keystore app/release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias bdcalorie \
              -storepass bdcaloriepassword \
              -keypass bdcaloriepassword \
              -dname "CN=Mehedi Hasan Rajon, OU=Dev, O=BDCalorieTracker, L=Dhaka, S=Dhaka, C=BD"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Compiled Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-Calorie-Tracker-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
