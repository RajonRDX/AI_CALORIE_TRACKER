name: Build BD Calorie Tracker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Release Keystore
        run: |
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -alias bdcalorie \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bdcaloriepassword \
            -keypass bdcaloriepassword \
            -dname "CN=Mehedi Hasan Rajon, OU=Dev, O=BDCalorieTracker, L=Dhaka, S=Dhaka, C=BD"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-Calorie-Tracker-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
